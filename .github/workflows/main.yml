name: CI
on:
  push:
    branches:
      - 'master'
  pull_request:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        # [Python version, tox env]
        - ["3.11", "py311-plone60"]
        - ["3.12", "py312-plone60"]
        - ["3.11", "py311-plone61"]
        - ["3.13", "py313-plone61"]
        - ["3.11", "py311-plone62"]
        - ["3.13", "py313-plone62"]
        - ["3.14", "py314-plone62"]
        - ["3.13", "py313-plone62-pas43"]
    name: ${{ matrix.config[1] }}
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.config[0] }}
    - name: Test
      run: uvx --with tox-uv tox -e ${{ matrix.config[1] }}

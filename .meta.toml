# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[gitignore]
extra_lines = """
# buildout local dev (Makefile)
.plone-version
.plone.versioncheck.tracked.json
.python-version
CACHEDIR.TAG
pyvenv.cfg
src/*
!src/collective
htmlcov/
*.log
output.xml
report.html
"""

[tox]
test_environment_variables = """
    # Playwright (rfbrowser init) does not know ubuntu-latest 26.04 yet
    PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
    # headless Chrome: ElementClickInterceptedException on the login form
    ROBOT_BROWSER=headlessfirefox
"""
test_matrix = {"6.2" = ["*"]}

[pyproject]
codespell_ignores = "checkin,loggin,accesible"
dependencies_ignores = "['plone.app.iterate', 'plone.dexterity', 'Products.CMFPlone']"

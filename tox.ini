[tox]
envlist =
    py{311,312}-plone60
    py{311,312,313}-plone61
    py{311,312,313,314}-plone62
    py{313,314}-plone62-pas43
skip_missing_interpreters = True

[testenv]
description = run the tests against the constraints of a Plone release
setenv =
    plone60: PLONE_VERSION=6.0
    plone61: PLONE_VERSION=6.1
    plone62: PLONE_VERSION=6.2
    PIP_CONSTRAINT=https://dist.plone.org/release/{env:PLONE_VERSION}-latest/constraints.txt
    UV_CONSTRAINT=https://dist.plone.org/release/{env:PLONE_VERSION}-latest/constraints.txt
package = editable
extras = test
allowlist_externals =
    env
    uv
commands_pre =
    pas43: env -u UV_CONSTRAINT -u PIP_CONSTRAINT uv pip install --python {envpython} --no-deps -r {toxinidir}/requirements-pas43.txt
commands =
    zope-testrunner --test-path={toxinidir}/src {posargs:-vc}

[coverage:report]
include = src/collective/fingerpointing/*

[distutils]
index-servers =
    pypi

[isort]
force_alphabetical_sort = True
force_single_line = True
line_length = 200
lines_after_imports = 2

[zest.releaser]
create-wheel = yes
extra-message = [skip ci]
tag-signing = yes


[check-manifest]
ignore =
  .eslintrc
  *.cfg
  requirements-pas43.txt
  tox.ini
